---
- name: Update package cache
  apt:
    update_cache: yes

- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Start and enable nginx
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Deploy custom index.html
  copy:
    content: "<h1>Welcome to My Ansible-Configured Server!</h1><p>This server was automatically configured using Ansible playbooks</p>"
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: '0644'
